name: Android 5 stability battery

on:
  pull_request:
  workflow_dispatch:

jobs:
  api21-x86-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout receiver
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Run session-transition stress tests
        run: |
          chmod +x gradlew
          python3 tools/verify_android_1_8_22.py
          ./gradlew :app:testReleaseUnitTest             --tests 'io.github.jqssun.airplay.service.SessionContinuityPolicyTest'             --stacktrace
          ./gradlew :app:assembleDebug --stacktrace

      - name: Exercise APK on Android 5 x86
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 21
          target: default
          arch: x86
          profile: Nexus 7
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          disable-animations: true
          script: sh tools/test_api21_lifecycle.sh

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: C3-Media-1.8.22-stability-log
          path: |
            c3-lifecycle-logcat.txt
            c3-lifecycle-services.txt
            c3-lifecycle-activities.txt
          if-no-files-found: warn
