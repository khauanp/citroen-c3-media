name: Build K00E APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android-5-x86:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with native dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Install Android NDK
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-21" "platforms;android-36" "build-tools;35.0.0"

      - name: Test, build and lint
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk C3-Media-1.0.0-K00E.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: C3-Media-1.0.0-K00E
          path: C3-Media-1.0.0-K00E.apk
          if-no-files-found: error
