name: Build K00E 1.8.23 playlist-hardened media APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  media-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout media receiver
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Build and test Android 5 x86 receiver
        run: |
          chmod +x gradlew
          python3 tools/verify_android_1_8_23.py
          for attempt in 1 2 3; do
            if ./gradlew :app:testReleaseUnitTest :app:assembleDebug :app:assembleRelease --stacktrace; then
              break
            fi
            test "$attempt" -lt 3
            sleep 5
          done

      - name: Verify media-only scope
        run: |
          apk="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          test -f "$apk"
          unzip -t "$apk"
          unzip -l "$apk" > build-apk-files.txt
          grep -q 'lib/x86/libairplay_native.so' build-apk-files.txt
          if grep -Eq 'lib/(arm|arm64|x86_64|mips)' build-apk-files.txt; then
            echo "Unexpected ABI in K00E APK"
            exit 1
          fi
          test "$(unzip -p "$apk" lib/x86/libairplay_native.so | sha256sum | awk '{print $1}')" = "327b381a2719aaa176f70a69d231e3c4671357c4cb0c87be74b99eb183c3e5b5"
          test "$(unzip -p "$apk" lib/x86/liboboe.so | sha256sum | awk '{print $1}')" = "5541263e80ba3a4471a1372d08d1dd72fc8378d6a90deb598bf07525656c23eb"
          test "$(unzip -p "$apk" lib/x86/libc++_shared.so | sha256sum | awk '{print $1}')" = "649cf75deda40f5985f316d1cc63cba59466db453e610a14e983e36be0caaa94"
          unzip -p "$apk" classes.dex | strings > build-dex-strings.txt
          for forbidden in             RouteReceiverServer RouteWebViewModule RouteResourceProxy             RouteProxyWebViewClient C3Map C3LinkNavigation MapTile             DacpController RadioMediaSession RadioButtonReceiver NanoHTTPD             waze_webview closeWazeButton; do
            if grep -Fq "$forbidden" build-dex-strings.txt; then
              echo "Forbidden removed component remains: $forbidden"
              exit 1
            fi
          done
          for required in             AirPlayService AudioRenderer VideoRenderer VideoPipeline             HotspotController EnergyController C3MediaApplication CrashDiagnostics             DayNightPolicy drawRotatingArtwork onCloseApp onAudioActivity Citroen-C3; do
            grep -Fq "$required" build-dex-strings.txt
          done
          mkdir -p build/final
          cp "$apk" build/final/C3-Media-1.8.23-K00E-unsigned.apk

      - name: Upload unsigned media-only APK
        uses: actions/upload-artifact@v4
        with:
          name: C3-Media-1.8.23-K00E-unsigned
          path: build/final/C3-Media-1.8.23-K00E-unsigned.apk
          if-no-files-found: error
