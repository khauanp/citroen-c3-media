name: Build K00E 1.8.14 stable media and MBTiles APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  preserve-1-8-1:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APKTOOL_VERSION: "3.0.3"
      APKTOOL_SHA256: dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423
      BASE_APK_SHA256: be86b35046e09ca900bd0acb30b47101e40a72e7ef0fc33f1a6085c26d9ccb3f
    steps:
      - name: Checkout focused maintenance patch
        uses: actions/checkout@v4

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Download exact 1.8.1 tablet APK and pinned apktool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/base
          gh release download v1.8.1 --pattern "C3-Media-1.8.1-K00E.apk" --dir build/base
          printf '%s  %s\n' "$BASE_APK_SHA256" "build/base/C3-Media-1.8.1-K00E.apk" | sha256sum -c -
          curl -fL "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar" -o build/apktool.jar
          printf '%s  %s\n' "$APKTOOL_SHA256" "build/apktool.jar" | sha256sum -c -

      - name: Test policies and compile isolated Android 5 helpers
        run: |
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest --stacktrace
          ./gradlew :app:compileReleaseKotlin --stacktrace
          classes_dir="app/build/tmp/kotlin-classes/release"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mapfile -t helper_classes < <(find "$classes_dir/io/github/jqssun/airplay/audio" -maxdepth 1 -type f \( -name 'DacpController*.class' -o -name 'RadioMediaSession*.class' -o -name 'RadioButtonReceiver*.class' \) | sort)
          mapfile -t mbtiles_classes < <(find "$classes_dir/io/github/jqssun/airplay/connectivity" -maxdepth 1 -type f -name 'C3MbTilesStore*.class' | sort)
          helper_classes+=("${mbtiles_classes[@]}")
          test "${#helper_classes[@]}" -gt 5
          mkdir -p build/helper-dex
          "$build_tools/d8" --min-api 21 --lib "$ANDROID_HOME/platforms/android-36/android.jar" --classpath "$classes_dir" --output build/helper-dex "${helper_classes[@]}"
          cp build/base/C3-Media-1.8.1-K00E.apk build/helper.apk
          zip -dq build/helper.apk classes.dex
          (cd build/helper-dex && zip -q ../helper.apk classes.dex)
          java -jar build/apktool.jar d -f -r -o build/helper-decoded build/helper.apk

      - name: Build 1.8.11, 1.8.12 and final 1.8.14 references
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/apktool-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/apktool-config"
          java -jar build/apktool.jar d -f -o build/original build/base/C3-Media-1.8.1-K00E.apk
          cp -a build/original build/reference-1811
          python3 tools/apply_android_1_8_11_daylight.py build/reference-1811 build/helper-decoded
          java -jar build/apktool.jar b build/reference-1811 -o build/reference-1811.apk
          java -jar build/apktool.jar d -f -o build/reference-1811-rebuilt build/reference-1811.apk
          cp -a build/original build/reference-1812
          python3 tools/apply_android_1_8_12_controls.py build/reference-1812 build/helper-decoded
          java -jar build/apktool.jar b build/reference-1812 -o build/reference-1812.apk
          java -jar build/apktool.jar d -f -o build/reference-1812-rebuilt build/reference-1812.apk
          cp -a build/original build/patched
          python3 tools/apply_android_1_8_14_mbtiles.py build/patched build/helper-decoded
          java -jar build/apktool.jar b build/patched -o build/C3-Media-1.8.14-K00E-unsigned.apk
          java -jar build/apktool.jar d -f -o build/rebuilt build/C3-Media-1.8.14-K00E-unsigned.apk

      - name: Verify rollback, map database and preserved resources
        run: |
          python3 tools/verify_android_1_8_14_mbtiles.py build/reference-1811-rebuilt build/reference-1812-rebuilt build/rebuilt
          unzip -t build/C3-Media-1.8.14-K00E-unsigned.apk

      - name: Upload unsigned maintenance APK
        uses: actions/upload-artifact@v4
        with:
          name: C3-Media-1.8.14-K00E-unsigned
          path: build/C3-Media-1.8.14-K00E-unsigned.apk
          if-no-files-found: error
