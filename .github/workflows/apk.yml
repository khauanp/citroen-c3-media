name: Build K00E 1.8.7 exact navigation APK

on:
  push:
    branches: [main]
    paths:
      - "tools/apply_android_1_8_7_navigation.py"
      - "tools/verify_android_1_8_7_navigation.py"
      - "tools/android_1_8_7/**"
      - ".github/workflows/apk.yml"
  pull_request:
    paths:
      - "tools/apply_android_1_8_7_navigation.py"
      - "tools/verify_android_1_8_7_navigation.py"
      - "tools/android_1_8_7/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

jobs:
  preserve-1-8-1:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APKTOOL_VERSION: "3.0.3"
      APKTOOL_SHA256: dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423
      BASE_APK_SHA256: be86b35046e09ca900bd0acb30b47101e40a72e7ef0fc33f1a6085c26d9ccb3f
    steps:
      - name: Checkout focused maintenance patch
        uses: actions/checkout@v4

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Download exact 1.8.1 tablet APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/base
          gh release download v1.8.1 \
            --pattern "C3-Media-1.8.1-K00E.apk" \
            --dir build/base
          printf '%s  %s\n' "$BASE_APK_SHA256" "build/base/C3-Media-1.8.1-K00E.apk" | sha256sum -c -

      - name: Download pinned apktool
        run: |
          curl -fL \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar" \
            -o build/apktool.jar
          printf '%s  %s\n' "$APKTOOL_SHA256" "build/apktool.jar" | sha256sum -c -

      - name: Apply exact route, radar, speed, and media maintenance
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/apktool-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/apktool-config"
          java -jar build/apktool.jar d -f \
            -o build/original \
            build/base/C3-Media-1.8.1-K00E.apk
          cp -a build/original build/patched
          python3 tools/apply_android_1_8_7_navigation.py build/patched
          java -jar build/apktool.jar b \
            build/patched \
            -o build/C3-Media-1.8.7-K00E-unsigned.apk

      - name: Prove UI, player and native library are unchanged
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/apktool-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/apktool-config"
          java -jar build/apktool.jar d -f \
            -o build/rebuilt \
            build/C3-Media-1.8.7-K00E-unsigned.apk
          python3 tools/verify_android_1_8_7_navigation.py build/original build/rebuilt
          unzip -t build/C3-Media-1.8.7-K00E-unsigned.apk

      - name: Upload unsigned maintenance APK
        uses: actions/upload-artifact@v4
        with:
          name: C3-Media-1.8.7-K00E-unsigned
          path: build/C3-Media-1.8.7-K00E-unsigned.apk
          if-no-files-found: error
