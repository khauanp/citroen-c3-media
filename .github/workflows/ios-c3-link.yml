name: Build C3 Link iPhone

on:
  push:
    branches: [main]
    paths:
      - "ios/C3Link/**"
      - "C3-Link-1.8.0-github-source.zip"
      - ".github/workflows/ios-c3-link.yml"
  pull_request:
    paths:
      - "ios/C3Link/**"
      - ".github/workflows/ios-c3-link.yml"
  workflow_dispatch:

jobs:
  unsigned-ipa:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract C3 Link source
        run: unzip -q -o C3-Link-1.8.0-github-source.zip -d .

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios/C3Link
        run: xcodegen generate

      - name: Compile without signing
        working-directory: ios/C3Link
        run: |
          xcodebuild \
            -project C3Link.xcodeproj \
            -scheme C3Link \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Validate iPhone build
        working-directory: ios/C3Link
        run: |
          app_path="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          executable="$app_path/C3 Link"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")" = "1.8.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")" = "4"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "$app_path/Info.plist")" = "location"
          /usr/bin/lipo "$executable" -verify_arch arm64
          /usr/bin/file "$executable"

      - name: Package unsigned IPA
        working-directory: ios/C3Link
        run: |
          app_path="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          mkdir -p Payload
          cp -R "$app_path" Payload/
          /usr/bin/zip -qry C3-Link-1.8.0-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: C3-Link-1.8.0-unsigned
          path: ios/C3Link/C3-Link-1.8.0-unsigned.ipa
          if-no-files-found: error

      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.8.0 >/dev/null 2>&1; then
            gh release upload v1.8.0 ios/C3Link/C3-Link-1.8.0-unsigned.ipa --clobber
          else
            gh release create v1.8.0 ios/C3Link/C3-Link-1.8.0-unsigned.ipa \
              --title "C3 Media 1.8.0" \
              --notes "C3 Media 1.8.0 final para o tablet K00E e C3 Link 1.8.0 sem assinatura para instalação pelo Sideloadly."
